# Remote storage for the Apache Maven Build Cache Extension, shared by several projects (TMail first, others later).
# The extension does all the cache logic; this server only stores and serves files by path:
#   /<project>/v1.2/<groupId>/<artifactId>/<key>/buildinfo.xml (+ artifacts)
#   /<project>/v1.2/<rootGroupId>/<rootArtifactId>/<buildId>/build-cache-report.xml
# A project points its extension at http(s)://<host>/<project> (see docs/design.md, section 6).
#
# Access:
#   - reads (GET, HEAD) are open: the server sits on the internal network
#   - writes (PUT) need the writer credential of that project: htpasswd.d/<project>. A project's CI therefore cannot
#     write into another project's folder, and a project without a credential file cannot be written at all
#   - nothing can be overwritten or deleted: entries are immutable once written, concurrent writes included
#   - an entry is only visible to readers once the cleanup job (evict.sh) has verified its files against its buildinfo.xml:
#     until then its buildinfo.xml answers 404, which the extension reads as a cache miss

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format cache '$time_iso8601 $remote_user "$request" $status $body_bytes_sent $request_length';
    access_log /var/log/nginx/access.log cache;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    server_tokens off;

    # At most one PUT at a time per entry: the "no overwrite" check below runs before the upload, so without this two
    # concurrent PUTs on the same new file could both pass it, and the later one would replace the first.
    # Keyed on the entry folder (a 64-character key), not the whole path: nginx ignores limit_conn keys over 255 bytes.
    # Other PUT paths share one key; reads are not limited (empty key)
    map "$request_method:$uri" $put_entry {
        "~^PUT:/[a-z0-9][a-z0-9-]*/[^/]+/[^/]+/[^/]+/(?<entry>[^/]+)/[^/]+$" $entry;
        "~^PUT:" other;
        default "";
    }
    limit_conn_zone $put_entry zone=put_per_entry:10m;

    # Dot-files (the .verified marker of the cleanup job) are the server's own: nobody uploads them
    map "$request_method:$uri" $put_dotfile {
        "~^PUT:.*/\.[^/]*$" 1;
        default 0;
    }

    # The folder of an entry, when the request is for its buildinfo.xml
    map $uri $entry_of_buildinfo {
        "~^(?<folder>/[a-z0-9][a-z0-9-]*/.+)/buildinfo\.xml$" $folder;
        default "";
    }

    # The project is the first path segment
    map $uri $cache_project {
        "~^/(?<name>[a-z0-9][a-z0-9-]*)/" $name;
        default "";
    }

    server {
        listen 80;
        root /data;

        # Entries hold module jars and compiled classes: some James distribution zips are a few hundred MB
        client_max_body_size 1g;
        # Same filesystem as /data, so a finished upload is renamed into place atomically:
        # a reader never sees a half-written entry
        client_body_temp_path /data/.upload-tmp;

        # These rules sit at server level on purpose: inside a location holding limit_except,
        # nginx skips if/set rules for the restricted methods, so they would never apply to PUT.
        #
        if ($put_dotfile) {
            return 403;
        }
        # Writes are only possible for a project that has a credential file
        set $write_guard "";
        if ($request_method = PUT) {
            set $write_guard "put";
        }
        if (!-f /etc/nginx/htpasswd.d/$cache_project) {
            set $write_guard "${write_guard}+unknown-project";
        }
        if ($write_guard = "put+unknown-project") {
            return 403;
        }
        # Entries are immutable: a PUT on an existing file is refused, so even a leaked writer credential
        # cannot replace an entry that builds already trust
        set $overwrite "";
        if ($request_method = PUT) {
            set $overwrite "put";
        }
        if (-e $request_filename) {
            set $overwrite "${overwrite}+exists";
        }
        if ($overwrite = "put+exists") {
            return 409;
        }
        # Readers only see verified entries: an entry being uploaded, or mixing files of two uploads, stays a cache miss
        set $read_gate "";
        if ($request_method ~ ^(GET|HEAD)$) {
            set $read_gate "read";
        }
        if ($entry_of_buildinfo != "") {
            set $read_gate "${read_gate}+buildinfo";
        }
        if (!-f /data$entry_of_buildinfo/.verified) {
            set $read_gate "${read_gate}+unverified";
        }
        if ($read_gate = "read+buildinfo+unverified") {
            return 404;
        }

        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        location ~ "^/[a-z0-9][a-z0-9-]*/" {
            limit_conn put_per_entry 1;
            limit_conn_status 409;
            dav_methods PUT;
            create_full_put_path on;
            dav_access user:rw group:r all:r;
            # No listing: the extension only fetches known paths, and a missing file must answer 404
            # (the extension reads 403 as an error, not as a cache miss)
            autoindex off;

            limit_except GET HEAD {
                auth_basic "maven-build-cache";
                auth_basic_user_file /etc/nginx/htpasswd.d/$cache_project;
            }
        }

        location / {
            return 404;
        }
    }
}
